name: Release AXL preinstalled runtimes

on:
  push:
    tags:
      - 'dsh-custom-v*'

permissions:
  contents: write

env:
  NODE_VERSION: '24.19.0'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  pack:
    name: Pack patched workspace packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and build patched source
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:official

      - name: Pack release families
        run: |
          pnpm run release:pack --family dsh --out dist/npm
          pnpm run release:pack --family vendor --out dist/npm-vendor

      - uses: actions/upload-artifact@v4
        with:
          name: patched-package-tarballs
          path: |
            dist/npm/*.tgz
            dist/npm-vendor/*.tgz
          if-no-files-found: error
          retention-days: 3

  assemble:
    name: Assemble ${{ matrix.asset }}
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            arch: x64
            asset: windows-x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            asset: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            asset: linux-arm64
          - os: macos-latest
            platform: macos
            arch: arm64
            asset: macos-arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
            asset: macos-x64
    runs-on: ${{ matrix.os }}
    # Native optional dependencies on hosted macOS/arm64 runners can take
    # substantially longer than Windows extraction. The end-user archive is
    # still preinstalled; this timeout only bounds the release builder.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: patched-package-tarballs
          path: dist/packs

      - name: Assemble preinstalled runtime (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#dsh-custom-v}"
          runtime="$RUNNER_TEMP/dsh-axl-${{ matrix.asset }}-$version"
          node scripts/release/build-preinstalled-runtime.mjs \
            --dsh-pack dist/packs/npm \
            --vendor-pack dist/packs/npm-vendor \
            --out "$runtime" \
            --node-bin "$(command -v node)" \
            --settings-template install/settings.official.yaml \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --platform '${{ matrix.platform }}' \
            --arch '${{ matrix.arch }}' \
            --include-package '@deepseek-ai/dsh-acp'
          node scripts/release/verify-preinstalled-runtime.mjs \
            "$runtime" "$RUNNER_TEMP/dsh-runtime-verification"
          echo "RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Assemble preinstalled runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^dsh-custom-v', ''
          if (-not $version) { throw 'missing dsh-custom-v* tag' }
          $runtime = Join-Path $env:RUNNER_TEMP "dsh-axl-${{ matrix.asset }}-$version"
          node scripts/release/build-preinstalled-runtime.mjs `
            --dsh-pack dist/packs/npm `
            --vendor-pack dist/packs/npm-vendor `
            --out $runtime `
            --node-bin (Get-Command node).Source `
            --settings-template install/settings.official.yaml `
            --repository $env:GITHUB_REPOSITORY `
            --commit $env:GITHUB_SHA `
            --platform '${{ matrix.platform }}' `
            --arch '${{ matrix.arch }}' `
            --include-package '@deepseek-ai/dsh-acp'
          node scripts/release/verify-preinstalled-runtime.mjs `
            $runtime (Join-Path $env:RUNNER_TEMP 'dsh-runtime-verification')
          "RUNTIME=$runtime" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Archive Unix runtime
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          archive="dsh-axl-${{ matrix.asset }}-${VERSION}.tar.gz"
          tar -czf "dist/release/$archive" -C "$RUNTIME" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "dist/release/$archive" > "dist/release/$archive.sha256"
          else
            shasum -a 256 "dist/release/$archive" > "dist/release/$archive.sha256"
          fi

      - name: Archive Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          $archive = "dsh-axl-${{ matrix.asset }}-$env:VERSION.zip"
          Compress-Archive -Path "$env:RUNTIME/*" -DestinationPath "dist/release/$archive" -CompressionLevel Optimal
          $hash = (Get-FileHash "dist/release/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -Encoding ASCII "dist/release/$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.asset }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release assets
    needs: assemble
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: dist/release
          merge-multiple: true

      - name: Publish checksummed platform assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "DSH AXL preinstalled runtimes ${GITHUB_REF_NAME}" \
              --notes "Platform-native preinstalled runtimes built from the AXL fork commit ${GITHUB_SHA}. Each archive bundles Node, resolved runtime dependencies, fork fixes, and a credential-free settings template. These are not the official npm rc8 package."
          fi
